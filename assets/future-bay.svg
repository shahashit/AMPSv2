<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Archivo, Arial, sans-serif">
  <title>Concept animation: robot-assisted wheel removal on an electric vehicle</title>
  <style>
    .boom{transform-origin:200px 352px;animation:boom 10s cubic-bezier(.45,.05,.25,1) infinite}
    .grip{animation:grip 10s cubic-bezier(.45,.05,.25,1) infinite}
    .wheel{animation:wheel 10s cubic-bezier(.45,.05,.25,1) infinite}
    .spin{transform-origin:430px 372px;animation:spin 10s linear infinite}
    .nut{animation:nut 10s ease-in-out infinite}
    .jaw1{transform-origin:0 0;animation:jaw1 10s ease-in-out infinite}
    .jaw2{transform-origin:0 0;animation:jaw2 10s ease-in-out infinite}
    .scan{animation:scan 10s ease-in-out infinite}
    .s1{animation:s1 10s step-end infinite}.s2{animation:s2 10s step-end infinite}.s3{animation:s3 10s step-end infinite}.s4{animation:s4 10s step-end infinite}
    .b1{animation:b1 10s linear infinite}
    @keyframes boom{0%,12%{transform:scaleX(1)}30%,42%{transform:scaleX(2.05)}60%,72%{transform:scaleX(1.05)}88%,100%{transform:scaleX(1)}}
    @keyframes grip{0%,12%{transform:translateX(0)}30%,42%{transform:translateX(118px)}60%,72%{transform:translateX(6px)}88%,100%{transform:translateX(0)}}
    @keyframes wheel{0%,42%{transform:translateX(0)}60%,72%{transform:translateX(-112px)}86%,100%{transform:translateX(0)}}
    @keyframes spin{0%,30%{transform:rotate(0)}42%{transform:rotate(-200deg)}100%{transform:rotate(-200deg)}}
    @keyframes nut{0%,30%{fill:#0B2A3E}33%,42%{fill:#FA541C}45%,100%{fill:#0B2A3E}}
    @keyframes jaw1{0%,28%{transform:rotate(-18deg)}33%,74%{transform:rotate(0)}80%,100%{transform:rotate(-18deg)}}
    @keyframes jaw2{0%,28%{transform:rotate(18deg)}33%,74%{transform:rotate(0)}80%,100%{transform:rotate(18deg)}}
    @keyframes scan{0%,4%{opacity:0;transform:translateY(-40px)}8%{opacity:.9}16%{opacity:.9;transform:translateY(60px)}20%,100%{opacity:0;transform:translateY(60px)}}
    @keyframes s1{0%{opacity:1}30%{opacity:.28}}
    @keyframes s2{0%{opacity:.28}30%{opacity:1}44%{opacity:.28}}
    @keyframes s3{0%{opacity:.28}44%{opacity:1}74%{opacity:.28}}
    @keyframes s4{0%{opacity:.28}74%{opacity:1}96%{opacity:.28}}
    @keyframes b1{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce){.boom,.grip,.wheel,.spin,.nut,.jaw1,.jaw2,.scan,.s1,.s2,.s3,.s4,.b1{animation:none}.s1,.s2,.s3,.s4{opacity:1}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B2A3E"/><stop offset="1" stop-color="#061722"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9D6DF"/><stop offset=".55" stop-color="#93A7B5"/><stop offset="1" stop-color="#5E7484"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2C5470"/><stop offset="1" stop-color="#0E2A3D"/></linearGradient>
    <linearGradient id="armg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9EEF2"/><stop offset="1" stop-color="#9FB1BF"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#168BC4" stop-opacity=".35"/><stop offset="1" stop-color="#168BC4" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <ellipse cx="640" cy="330" rx="520" ry="200" fill="url(#glow)"/>
  <!-- floor grid -->
  <g stroke="#1A4560" stroke-width="1" opacity=".7">
    <line x1="40" y1="452" x2="1160" y2="452"/><line x1="0" y1="490" x2="1200" y2="490"/><line x1="0" y1="535" x2="1200" y2="535"/>
    <line x1="200" y1="452" x2="120" y2="560"/><line x1="420" y1="452" x2="380" y2="560"/><line x1="640" y1="452" x2="640" y2="560"/><line x1="860" y1="452" x2="900" y2="560"/><line x1="1080" y1="452" x2="1160" y2="560"/>
  </g>
  <!-- lift -->
  <g>
    <rect x="455" y="420" width="560" height="10" rx="3" fill="#FA541C"/>
    <rect x="560" y="430" width="22" height="22" fill="#2A4A60"/><rect x="890" y="430" width="22" height="22" fill="#2A4A60"/>
    <rect x="530" y="450" width="82" height="8" fill="#2A4A60"/><rect x="860" y="450" width="82" height="8" fill="#2A4A60"/>
  </g>
  <!-- car -->
  <g>
    <path d="M300 372 C300 330 330 316 372 310 L470 300 C520 250 580 222 690 220 C800 218 860 238 930 282 L1010 296 C1050 304 1066 324 1066 352 L1066 384 C1066 392 1060 398 1052 398 L320 398 C308 398 300 390 300 378 Z" fill="url(#body)"/>
    <path d="M492 300 C536 258 590 238 682 236 L690 300 Z" fill="url(#glass)"/>
    <path d="M708 236 C790 236 846 252 900 290 L708 300 Z" fill="url(#glass)"/>
    <rect x="696" y="236" width="8" height="64" fill="#5E7484"/>
    <path d="M300 352 L360 350" stroke="#7CC6EC" stroke-width="5" stroke-linecap="round"/>
    <path d="M1040 318 L1064 322" stroke="#FA541C" stroke-width="6" stroke-linecap="round"/>
    <line x1="520" y1="330" x2="1000" y2="330" stroke="#6F8796" stroke-width="2"/>
    <rect x="560" y="388" width="300" height="8" rx="2" fill="#168BC4" opacity=".8"/>
    <text x="710" y="384" text-anchor="middle" font-size="11" fill="#E6F3FA" letter-spacing="2">HV BATTERY</text>
    <!-- wheel arch shadows -->
    <circle cx="430" cy="372" r="70" fill="#0B1E2B"/>
    <circle cx="930" cy="372" r="70" fill="#0B1E2B"/>
    <!-- rear wheel (static) -->
    <g>
      <circle cx="930" cy="372" r="60" fill="#14232E"/><circle cx="930" cy="372" r="40" fill="#8EA2B0"/><circle cx="930" cy="372" r="12" fill="#0B2A3E"/>
      <g stroke="#5E7484" stroke-width="6"><line x1="930" y1="336" x2="930" y2="408"/><line x1="894" y1="372" x2="966" y2="372"/></g>
    </g>
  </g>
  <!-- front wheel (animated) -->
  <g class="wheel">
    <circle cx="430" cy="372" r="60" fill="#14232E" stroke="#22394A" stroke-width="3"/>
    <g class="spin">
      <circle cx="430" cy="372" r="40" fill="#A9BAC6"/>
      <g stroke="#6F8796" stroke-width="7"><line x1="430" y1="334" x2="430" y2="410"/><line x1="392" y1="372" x2="468" y2="372"/><line x1="403" y1="345" x2="457" y2="399"/><line x1="457" y1="345" x2="403" y2="399"/></g>
      <circle cx="430" cy="372" r="14" fill="#0B2A3E"/>
      <g class="nut"><circle cx="430" cy="352" r="4"/><circle cx="450" cy="372" r="4"/><circle cx="430" cy="392" r="4"/><circle cx="410" cy="372" r="4"/></g>
    </g>
  </g>
  <!-- scan beam -->
  <rect class="scan" x="350" y="300" width="160" height="4" fill="#7CC6EC" opacity="0"/>
  <!-- robot -->
  <g>
    <path d="M140 452 L262 452 L246 424 L156 424 Z" fill="#2A4A60"/>
    <rect x="182" y="300" width="36" height="128" rx="6" fill="url(#armg)"/>
    <rect x="186" y="320" width="8" height="90" rx="3" fill="#FA541C"/>
    <circle cx="200" cy="300" r="26" fill="#DCE5EC" stroke="#9FB1BF" stroke-width="4"/>
    <circle cx="200" cy="300" r="10" fill="#FA541C"/>
    <rect x="190" y="296" width="20" height="60" rx="8" fill="#C9D6DF"/>
    <circle cx="200" cy="352" r="18" fill="#DCE5EC" stroke="#9FB1BF" stroke-width="4"/>
    <circle cx="200" cy="352" r="7" fill="#FA541C"/>
    <rect class="boom" x="200" y="344" width="100" height="16" rx="7" fill="url(#armg)"/>
    <g class="grip">
      <g transform="translate(300 352)">
        <circle r="14" fill="#DCE5EC" stroke="#9FB1BF" stroke-width="3"/><circle r="5" fill="#FA541C"/>
        <g class="jaw1"><path d="M6 -6 L34 -34 L44 -30 L20 -2 Z" fill="#E9EEF2" stroke="#9FB1BF" stroke-width="2"/><rect x="34" y="-38" width="16" height="7" rx="3" fill="#FA541C"/></g>
        <g class="jaw2"><path d="M6 6 L34 34 L44 30 L20 2 Z" fill="#E9EEF2" stroke="#9FB1BF" stroke-width="2"/><rect x="34" y="31" width="16" height="7" rx="3" fill="#FA541C"/></g>
      </g>
    </g>
  </g>
  <!-- annotations -->
  <g font-size="12" letter-spacing="2" fill="#7FA3BB">
    <line x1="710" y1="400" x2="710" y2="478" stroke="#3B6B8A" stroke-width="1"/><text x="716" y="494">EV PLATFORM</text>
    <line x1="430" y1="440" x2="430" y2="478" stroke="#3B6B8A" stroke-width="1"/><text x="380" y="494">WHEEL SERVICE</text>
    <text x="1160" y="40" text-anchor="end">BAY 01 / CONCEPT</text>
  </g>
  <!-- step labels -->
  <g font-size="14" font-weight="700">
    <g class="s1"><rect x="40" y="26" width="128" height="34" rx="4" fill="#0E3A57" stroke="#3B6B8A"/><text x="56" y="48" fill="#FFFFFF"><tspan fill="#FA541C">01</tspan>  Position</text></g>
    <g class="s2"><rect x="176" y="26" width="128" height="34" rx="4" fill="#0E3A57" stroke="#3B6B8A"/><text x="192" y="48" fill="#FFFFFF"><tspan fill="#FA541C">02</tspan>  Release</text></g>
    <g class="s3"><rect x="312" y="26" width="128" height="34" rx="4" fill="#0E3A57" stroke="#3B6B8A"/><text x="328" y="48" fill="#FFFFFF"><tspan fill="#FA541C">03</tspan>  Remove</text></g>
    <g class="s4"><rect x="448" y="26" width="128" height="34" rx="4" fill="#0E3A57" stroke="#3B6B8A"/><text x="464" y="48" fill="#FFFFFF"><tspan fill="#FA541C">04</tspan>  Refit</text></g>
  </g>
  <rect x="40" y="70" width="536" height="3" fill="#1A4560"/>
  <rect class="b1" x="40" y="70" width="536" height="3" fill="#FA541C" style="transform-origin:40px 71px"/>
  <text x="40" y="532" font-size="12" letter-spacing="1.5" fill="#7FA3BB">CONCEPT ANIMATION · NOT A LIVE AMPS SERVICE · NOT PERFORMANCE DATA</text>
</svg>
