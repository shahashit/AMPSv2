<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-label="A rising transformation curve with five steps from today to year ten">
  <style>
    .grid{stroke:rgba(124,198,236,.14);stroke-width:1}
    .area{fill:url(#ag)}
    .curve{fill:none;stroke:#7CC6EC;stroke-width:4;stroke-linecap:round;stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 3.2s ease-out .3s forwards}
    .dot{fill:#071E2D;stroke:#7CC6EC;stroke-width:4;opacity:0;animation:pop .5s ease-out forwards}
    .now{fill:#FA541C;stroke:#FFFFFF}
    .ring{fill:none;stroke:#FA541C;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out 1s infinite;opacity:0}
    .a1{animation-delay:.4s}.a2{animation-delay:1.1s}.a3{animation-delay:1.8s}.a4{animation-delay:2.5s}.a5{animation-delay:3.1s}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:scale(1)}}
    @keyframes ping{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.6);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.curve{stroke-dashoffset:0}.dot{opacity:1}}
  </style>
  <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#168BC4" stop-opacity=".35"/><stop offset="1" stop-color="#168BC4" stop-opacity="0"/></linearGradient></defs>
  <g class="grid"><line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/></g>
  <path class="area" d="M120 222 C330 212 420 190 600 160 C780 128 900 80 1080 34 L1080 260 L120 260 Z"/>
  <path class="curve" d="M120 222 C330 212 420 190 600 160 C780 128 900 80 1080 34"/>
  <circle class="ring" cx="120" cy="222" r="12"/>
  <circle class="dot now a1" cx="120" cy="222" r="12" style="transform-box:fill-box;transform-origin:center"/>
  <circle class="dot a2" cx="360" cy="203" r="11" style="transform-box:fill-box;transform-origin:center"/>
  <circle class="dot a3" cx="600" cy="160" r="11" style="transform-box:fill-box;transform-origin:center"/>
  <circle class="dot a4" cx="840" cy="110" r="11" style="transform-box:fill-box;transform-origin:center"/>
  <circle class="dot a5" cx="1080" cy="34" r="11" style="transform-box:fill-box;transform-origin:center"/>
</svg>
